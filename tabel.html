<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Belajar Tabel - Colspan & Rowspan</title>
</head>
<body>
    <a href="halamanutama.html">kembali kehalaman utama</a>
<h3>Contoh Tabel dengan Sel Gabungan (colspan/rowspan)</h3>
<table border="0" cellspacing="25" cellpadding="0">
<tr>
  <td valign="top">
    <table border="1" cellspacing="0" cellpadding="8">
      <tr>
        <td>1</td><td>2</td><td>3</td>
      </tr>
      <tr>
        <td>4</td><td>5</td><td>6</td>
      </tr>
      <tr>
        <td>7</td><td>8</td><td>9</td>
      </tr>
    </table>
  </td>

  <td valign="top">
    <table border="1" cellspacing="0" cellpadding="8">
      <tr>
        <td>1</td><td colspan="2" align="center">2</td>
      </tr>
      <tr>
        <td>3</td><td>4</td><td>5</td>
      </tr>
      <tr>
        <td>6</td><td>7</td><td>8</td>
      </tr>
    </table>
  </td>

  <td valign="top">
    <table border="1" cellspacing="0" cellpadding="8">
      <tr>
        <td>1</td><td>2</td><td>3</td>
      </tr>
      <tr>
        <td colspan="3" align="center">4</td>
      </tr>
      <tr>
        <td>5</td><td>6</td><td>7</td>
      </tr>
    </table>
  </td>
</tr>

<tr>
  <td valign="top">
    <table border="1" cellspacing="0" cellpadding="8">
      <tr>
        <td>1</td><td colspan="2" align="center">2</td>
      </tr>
      <tr>
        <td>3</td><td>4</td><td>5</td>
      </tr>
      <tr>
        <td colspan="2" align="center">6</td><td>7</td>
      </tr>
    </table>
  </td>


  <td valign="top">
    <table border="1" cellspacing="0" cellpadding="8">
      <tr>
        <td rowspan="2" align="center">1</td><td>2</td><td rowspan="2" align="center">4</td>
      </tr>
      <tr>
        <td>3</td>
      </tr>
      <tr>
        <td>5</td><td>6</td><td>7</td>
      </tr>
    </table>
  </td>

  <td></td>
</tr>
</table>

<a href="index.html"> Home </a>

</body>
</html>
